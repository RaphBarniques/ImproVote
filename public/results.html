<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat du vote</title>
    <link rel="stylesheet" href="styles_result.css">
</head>
<body>
    <header>
        <img class="logo" src="logo.png" alt="logo">
        <section class="headerOpened">
            <h3>Résultat du vote</h3>
            <p class="proposition">Étant donné que, CITRUS sauve des vies et que les devs sont trop cools, Félix Robillard de Montmorency propose que la Coupe Pamplemousse soit renommée la coupe CITRUS</p>
        </section>
    </header>
    <main>
        <div class="option">
            <span class="optionNumber" id="pourVotes">100</span>
            <span>--</span>
            <span class="optionLabel">Pour</span>
        </div>
        <div class="option">
            <span class="optionNumber" id="contreVotes">20</span>
            <span>--</span>
            <span class="optionLabel">Contre</span>
        </div>
        <div class="option">
            <span class="optionNumber" id="abstentionVotes">5</span>
            <span>--</span>
            <span class="optionLabel">Abstention</span>
        </div>
    </main>
    <div class="buttonPanel">
        <button class="showButton" onclick="showResults(); socket.emit('show-results');">Afficher</button>
        <button class="hideButton" onclick="hideResults(); socket.emit('hide-results');">Masquer</button>
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
<script>
    // Handle connexion and identification
    const socket = io({
      query: {
        participantId: "resultBoard", //Avoid being part of the connection count
      }, path :"/guilde/socket.io/"
    });

    let results;
    let isDisplayed;

    function showResults() {
        isDisplayed = true
        document.querySelector(".hideButton").classList.remove("active");
        document.querySelector(".showButton").classList.add("active");

        document.getElementById('pourVotes').innerText = results.pour;
        document.getElementById('contreVotes').innerText = results.contre;
        document.getElementById('abstentionVotes').innerText = results.abstention;
    }

    function hideResults() {
        isDisplayed = false;
        document.querySelector(".hideButton").classList.add("active");
        document.querySelector(".showButton").classList.remove("active");

        let numbers = document.querySelectorAll(".optionNumber");
        numbers.forEach(number => {
            number.innerText = "--"
        });        
    }

    // Handle updates to the voting results
    socket.on('update-votes', (votes) => {
      console.log("Recieved vote update");
      results = votes;
      if (isDisplayed == true) {
        document.getElementById('pourVotes').innerText = votes.pour;
        document.getElementById('contreVotes').innerText = votes.contre;
        document.getElementById('abstentionVotes').innerText = votes.abstention;
      }
    });

    socket.on('update-status', ({isPollOpen, isResultShown}) => {
        isResultShown ? showResults() : hideResults();
        console.log("Received status update");
        });

    socket.on('reset', () => {
        result = {pour:0, contre:0, abstention:0}
        console.log("Votes reset");
        });
</script>
</html>
